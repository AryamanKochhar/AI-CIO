[project]
name = "ai-cio-api"
version = "0.2.0"
description = "AI-CIO FastAPI backend and domain layer"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn>=0.27",
  "sqlalchemy>=2.0",
  "alembic>=1.13",
  "psycopg2-binary>=2.9",
  "python-dotenv>=1.0",
  "python-multipart>=0.0.9",
  "PyMuPDF>=1.24",
  "mcp>=1.0",
  "httpx>=0.27",
  "pytest>=8.0",
]

[tool.pytest.ini_options]
pythonpath = [".", "apps/api"]
testpaths = ["tests"]
markers = [
  "integration: runtime tests that use the canonical database",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api"]
include = ["ai_cio*"]
