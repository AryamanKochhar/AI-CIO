name: ai-cio

x-api-env: &api-env
  PYTHONPATH: apps/api
  DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ai_cio}

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_cio_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_cio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_cio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: python:3.12-slim
    container_name: ai_cio_migrate
    working_dir: /app
    environment:
      <<: *api-env
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
    command: ["./scripts/docker-migrate.sh"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: python:3.12-slim
    container_name: ai_cio_api
    working_dir: /app
    environment:
      <<: *api-env
      API_HOST: 0.0.0.0
      API_PORT: 8000
      INSTRUMENT_PATH: /app/instruments/v1.0.json
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - .:/app
      - pip_cache:/root/.cache/pip
      - ./data:/app/data
    command: ["./scripts/docker-api.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 120s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    image: node:20-alpine
    container_name: ai_cio_web
    working_dir: /app
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_pnpm_store:/pnpm/store
    command: ["./scripts/docker-web.sh"]
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 180s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
  pip_cache:
  web_node_modules:
  web_pnpm_store:
