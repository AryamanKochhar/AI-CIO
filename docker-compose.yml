name: ai-cio

x-api-build: &api-build
  context: .
  dockerfile: apps/api/Dockerfile

x-api-env: &api-env
  PYTHONPATH: apps/api
  # From .env — currently Supabase session pooler; local Docker Postgres remains for TEST_DATABASE_URL
  DATABASE_URL: ${DATABASE_URL}

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_cio_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-ai_cio}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-ai_cio}",
        ]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

  migrate:
    image: ai-cio-api:local
    container_name: ai_cio_migrate
    env_file:
      - .env
    environment:
      <<: *api-env
    command: ["alembic", "upgrade", "head"]
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build: *api-build
    image: ai-cio-api:local
    container_name: ai_cio_api
    env_file:
      - .env
    environment:
      <<: *api-env
      API_HOST: 0.0.0.0
      API_PORT: 8000
      INSTRUMENT_PATH: /app/instruments/v1.0.json
    ports:
      - "${API_PORT:-8000}:8000"
    volumes:
      - ./apps/api:/app/apps/api
      - ./instruments:/app/instruments:ro
      - ./data:/app/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)",
        ]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile.dev
    image: ai-cio-web:local
    container_name: ai_cio_web
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${API_PUBLIC_URL:-http://localhost:8000}
    ports:
      - "${WEB_PORT:-3000}:3000"
    volumes:
      - ./apps/web/src:/app/apps/web/src
      - ./apps/web/next.config.ts:/app/apps/web/next.config.ts
      - ./apps/web/tsconfig.json:/app/apps/web/tsconfig.json
      - ./apps/web/postcss.config.js:/app/apps/web/postcss.config.js
      - ./apps/web/tailwind.config.ts:/app/apps/web/tailwind.config.ts
      - ./packages:/app/packages
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))",
        ]
      interval: 5s
      timeout: 5s
      retries: 24
      start_period: 30s
    depends_on:
      api:
        condition: service_healthy

volumes:
  postgres_data:
