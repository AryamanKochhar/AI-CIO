version: "3.8"

services:
  postgres:
    image: postgres:15-alpine
    container_name: ai_cio_db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: ai_cio
    ports:
      - "5432:5432"
    volumes:
      - ai_cio_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d ai_cio"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  ai_cio_postgres:
